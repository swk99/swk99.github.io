<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS One-Liner · GPT</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#172b25;font:16px system-ui,sans-serif}main{max-width:680px;margin:6vh auto;padding:24px}h1{font-size:32px;letter-spacing:-1px}p,small{color:#52645d;line-height:1.6}form{background:white;border:1px solid #dce5df;border-radius:20px;padding:24px}label{display:block;font-weight:600;margin:16px 0 8px}select,textarea,button{width:100%;font:inherit;padding:13px;border-radius:10px}select,textarea{border:1px solid #bacac1;background:white;color:inherit}textarea{min-height:100px;resize:vertical}button{background:#12664d;color:white;border:0;font-weight:600;margin-top:14px;cursor:pointer}.secondary{background:#e8f0eb;color:#12664d}small{display:block;margin-top:14px}</style></head><body><main><small>GPT · COMPUTER SCIENCE</small><h1>CS One-Liner</h1><p>Learn computer science one precise sentence at a time.</p><form id="f"><label for="topic">Topic</label><select id="topic"><option>Mixed computer science</option><option>Algorithms and data structures</option><option>Operating systems</option><option>Computer networks</option><option>Databases and SQL</option><option>Distributed systems</option><option>Object-oriented programming</option><option>Machine learning</option><option>Cloud and DevOps</option><option>Security</option></select><label for="mode">Study mode</label><select id="mode"><option value="quiz">Interview quiz</option><option value="explain">One-line explanation</option><option value="review">Review my answer</option></select><label for="detail">Concept or answer (optional for quiz)</label><textarea id="detail" placeholder="e.g. Path compression, ACID, TCP handshake"></textarea><button type="submit">Study with ChatGPT ↗</button><button type="button" class="secondary" id="copy">Copy prompt</button><small id="status" role="status">Opens ChatGPT in a new tab. No API key required.</small></form></main><script>
const el=id=>document.getElementById(id);
const instructions={quiz:"Act as a technical interviewer. Ask one CS question at a time in English. Wait for my answer before revealing the answer. Then give concise feedback, a technically accurate one-sentence model answer in English, and a short Korean explanation. Continue with the next question.",explain:"Explain the specified concept with one technically precise English sentence suitable for a technical interview, followed by a short Korean explanation and a concrete example. If no concept is supplied, choose a representative concept from the topic.",review:"Review my supplied technical answer for accuracy and natural English. Identify any misconception, give a precise one-sentence model answer, and explain corrections briefly in Korean. If no answer is supplied, ask me for one."};
function promptText(){return instructions[el("mode").value]+"\nTopic: "+el("topic").value+"\nConcept or answer: "+(el("detail").value.trim()||"Not specified");}
el("f").addEventListener("submit",e=>{e.preventDefault();window.open("https://chatgpt.com/?q="+encodeURIComponent(promptText()),"_blank","noopener,noreferrer");});
el("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(promptText());el("status").textContent="Prompt copied. Paste into ChatGPT.";}catch{el("status").textContent="Clipboard unavailable. Use Study with ChatGPT.";}});
</script></body></html>
