<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카톡 보내기</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#1b293b;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif}
main{max-width:560px;margin:48px auto;padding:0 20px}
h1{font-size:28px;letter-spacing:-1px;margin:0 0 6px}
.sub{color:#718096;font-size:14px;margin:0 0 26px}
.card{background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:22px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
textarea,input{width:100%;padding:12px;border:1px solid #cdd5e0;border-radius:10px;font:inherit;font-size:15px}
textarea{min-height:150px;resize:vertical}
.count{text-align:right;font-size:12px;color:#8490a0;margin-top:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.send{width:100%;background:#fee500;color:#191919;font-weight:700;padding:15px;font-size:16px;margin-top:14px}
.send:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;color:#6c7890;font-size:12px;padding:6px 0;text-decoration:underline}
.status{font-size:13px;margin-top:12px;min-height:18px}
.err{color:#c13a48}.ok{color:#247546}
.small{font-size:12px;color:#7c8796;line-height:1.7}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>카톡 보내기</h1>
  <p class="sub">보낼 때마다 카카오 로그인 → 받는 사람(나와의 채팅 포함) 선택</p>

  <div class="card" id="setup" hidden>
    <label for="key">카카오 JavaScript 키 (최초 1회)</label>
    <input id="key" type="text" placeholder="developers.kakao.com → 앱 키 → JavaScript 키" autocomplete="off">
    <button class="send" id="saveKey">저장</button>
    <p class="small">이 브라우저에만 저장돼요. 카카오 디벨로퍼스 → 플랫폼 → Web에 <b>https://swk99.github.io</b> 도메인을 등록해야 동작해요.</p>
  </div>

  <div class="card" id="composer" hidden>
    <label for="msg">메시지</label>
    <textarea id="msg" maxlength="200" placeholder="보낼 내용을 입력하세요"></textarea>
    <div class="count"><span id="len">0</span>/200</div>
    <label for="link" style="margin-top:12px">링크 (선택)</label>
    <input id="link" type="url" placeholder="https://...">
    <button class="send" id="send" disabled>카카오톡으로 보내기</button>
    <div class="status" id="status" role="status"></div>
    <button class="ghost" id="resetKey">JavaScript 키 다시 입력</button>
  </div>
</main>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  var KEY_STORE='kakao_js_key';
  var $=function(id){return document.getElementById(id)};
  function getKey(){try{return localStorage.getItem(KEY_STORE)}catch(e){return null}}
  function setKey(v){try{localStorage.setItem(KEY_STORE,v)}catch(e){}}
  function delKey(){try{localStorage.removeItem(KEY_STORE)}catch(e){}}
  function status(t,cls){var s=$('status');s.textContent=t;s.className='status '+(cls||'')}

  function start(){
    var key=getKey();
    if(!key){$('setup').hidden=false;$('composer').hidden=true;return}
    if(!window.Kakao){$('composer').hidden=false;status('카카오 SDK를 불러오지 못했어요. 새로고침 해보세요.','err');return}
    try{ if(!Kakao.isInitialized()) Kakao.init(key); }
    catch(e){status('키 초기화 실패: '+e.message,'err')}
    $('setup').hidden=true;$('composer').hidden=false;
  }

  $('saveKey').onclick=function(){
    var v=$('key').value.trim(); if(!v) return;
    setKey(v); start();
  };
  $('resetKey').onclick=function(){
    delKey(); try{Kakao.cleanup()}catch(e){} $('key').value=''; start();
  };
  $('msg').oninput=function(){
    var n=this.value.length; $('len').textContent=n; $('send').disabled=n===0;
  };
  $('send').onclick=function(){
    var text=$('msg').value.trim(); if(!text) return;
    var link=$('link').value.trim()||'https://swk99.github.io/kakao/';
    try{
      Kakao.Share.sendDefault({
        objectType:'text',
        text:text,
        link:{webUrl:link,mobileWebUrl:link}
      });
      status('카카오 창에서 받는 사람을 선택하세요.','ok');
    }catch(e){
      status('전송 실패: '+e.message+' (도메인 등록·키 확인)','err');
    }
  };
  start();
})();
</script>
</body>
</html>
