<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worklog Lite · Docs & tasks</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-locked">
<section id="auth-root" class="auth-screen"><div class="auth-card"><span class="brandmark">w</span><h1>Worklog</h1><p class="subtle">Checking your local session…</p></div></section>
<header class="topbar"><button class="brand" id="home"><span class="brandmark">w</span>Worklog<span class="brand-sub">docs + tasks</span></button><div class="global-search"><span aria-hidden="true">⌕</span><input id="search" placeholder="Search pages, projects and labels" aria-label="Search all pages"><kbd>Ctrl K</kbd></div><span class="local-badge"><i></i> Local only</span><button class="primary" id="create-top">＋ Create</button><span class="avatar" title="Single-user local workspace">ME</span><button id="logout" class="text-button">Sign out</button></header>
<div class="layout"><aside class="sidebar"><div class="workspace"><span class="workspace-icon">W</span><div><strong>My workspace</strong><small>Documents & tasks</small></div></div><nav><button class="nav-item" data-view="board"><span>▥</span> Board</button><button class="nav-item" data-view="backlog"><span>☷</span> Backlog</button><button class="nav-item active" data-view="home"><span>⌂</span> Overview</button><button class="nav-item" data-view="favorites"><span>☆</span> Favorites</button><button class="nav-item" data-view="recent"><span>◷</span> Recently updated</button><button class="nav-item" data-view="templates"><span>▦</span> Templates</button></nav><div class="section-label">SPACES<button id="new-space" aria-label="Create space">＋</button></div><div id="spaces"></div><div class="section-label tree-label">CONTENT<button id="create-child" aria-label="Create child page">＋</button></div><div id="tree"></div><div class="sidebar-bottom"><button class="nav-item" data-view="trash"><span>♧</span> Trash</button><button class="nav-item" id="backup"><span>⇩</span> Backup workspace</button><div class="storage-note"><i></i> Saved on this machine</div></div></aside><main id="main" tabindex="-1"></main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Close dialog">✕</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><input type="file" id="attachment-input" hidden><input type="file" id="import-input" accept=".md,.txt,text/plain,text/markdown" hidden>
<script src="/app.js"></script>
</body></html>
