<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>TypeScript Practice · Kodori</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eaf0fb;background:#0c1220}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#93c5fd}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px max(20px,calc((100vw - 1180px)/2));background:#151e31;border-bottom:1px solid #2d3b56}header b{font-size:20px}header a{text-decoration:none}main{max-width:1180px;margin:auto;padding:24px 18px;display:grid;grid-template-columns:310px 1fr;gap:22px}aside,.panel{background:#151e31;border:1px solid #2d3b56;border-radius:18px;padding:18px}aside{max-height:calc(100vh - 125px);overflow:auto;position:sticky;top:12px}h1{margin:0 0 8px;font-size:27px}h2{font-size:18px;margin:0 0 12px}p,.muted{color:#aebdd4;line-height:1.6}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:#1f2b43;padding:10px 14px;border-radius:12px}progress{width:100%;height:10px;accent-color:#38bdf8}.section{margin:9px 0}.section>button{width:100%;background:#24324c;color:#f1f5f9;border:0;text-align:left;padding:11px;border-radius:9px;font-weight:650}.lessons{padding:6px 0 4px}.lessons button{display:block;text-align:left;width:100%;padding:8px 10px;background:transparent;border:0;border-radius:8px;color:#b7c9e3;font-size:13px}.lessons button.active{background:#164e63;color:#fff}.lessons button:hover{background:#273a58}.panel{margin-bottom:18px}.pill{font-size:12px;border:1px solid #4c678a;border-radius:999px;padding:4px 9px;color:#bfe7ff}.options{display:grid;gap:10px;margin:16px 0}.option{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:13px;border:1px solid #3c4c67;border-radius:11px;background:#1d2940;color:#eaf0fb}.option:hover{border-color:#38bdf8}.option.selected{border-color:#38bdf8;background:#143b51}.option.correct{border-color:#34d399}.option.wrong{border-color:#fb7185}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{padding:11px 17px;border-radius:10px;border:0;font-weight:700}.primary{background:#38bdf8;color:#082033}.secondary{background:#334155;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}pre,textarea{width:100%;background:#0a1020;color:#d6edff;padding:16px;border:1px solid #34425c;border-radius:12px;overflow:auto;line-height:1.6}textarea{min-height:145px;resize:vertical} .feedback{padding:13px;border-radius:12px;background:#20354b;line-height:1.65}.tiny{font-size:12px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:780px){main{display:block;padding:12px}aside{position:static;max-height:340px;margin-bottom:15px}header{padding:15px}h1{font-size:23px}.panel{padding:15px}}
</style></head><body><header><b>🐨 Kodori · TypeScript Lab</b><a href="../">← Workspace</a></header><main><aside><h2>64강 커리큘럼</h2><input id="search" placeholder="강의 검색" aria-label="강의 검색" style="width:100%;padding:10px;border-radius:9px;background:#0c1220;color:white;border:1px solid #40516b"><div id="nav"></div></aside><div><div class="panel"><div class="toprow"><div><h1>TypeScript 실습 여행</h1><div class="muted">One-Bite 64강 순서 · 객관식 · 코드 빈칸 · 디버깅 · 직접 코딩</div></div><span class="pill">자동 저장</span></div><div class="stats"><div class="stat">완료 <b id="done">0/64</b></div><div class="stat">정답 <b id="score">0</b></div><div class="stat">오답 <b id="wrongCount">0</b></div></div><progress id="progress" value="0" max="64"></progress><div class="actions"><button class="secondary" id="review">오답 복습</button><button class="secondary" id="all">전체 문제 연습</button><button class="secondary" id="reset">진도 초기화</button></div></div><div class="panel" id="lesson"></div><div class="panel" id="practice"></div></div></main><script>
const DATA={"lectures":[["Course Introduction","Preparing the development environment","Join the Student Community","Introducing TypeScript","Limitations of JavaScript and TypeScript","How TypeScript Works","Hello TS World!","If ts-node is not working","Configuring TypeScript compiler options","If an error related to undici-types occurs"],["Primitive Types","Primitive Types and Literal Types","Arrays and Tuples","Object","Type Aliases and Index Signatures","Enum Type","Any and Unknown Types","Void and Never types"],["Understanding TypeScript","Types are sets","Exploring Basic Types with the Type Hierarchy","Compatibility of object types","Algebraic Data Types","Type Inference","Type Assertion","Type Narrowing","Discriminated Union Types"],["Function type","Function type expressions and call signatures","Compatibility of Function Types","Function Overloading","User-Defined Type Guards"],["Interface","Extending interfaces","Merging interfaces"],["Introduction to JavaScript Classes","Classes in TypeScript","Access Modifier","Interfaces and Classes"],["Introduction to Generics","Applying Type Variables","Defining types for map and forEach methods","Generic Interfaces & Generic Type Aliases","Generic Class","Promises and Generics"],["Manipulating Types","Indexed Access Types","keyof operator","Mapped Types","Template Literal Types"],["Introduction to Conditional Types","Distributive Conditional Types","infer - Inferring types within conditional types"],["Introduction to Utility Types","Mapped Type-based Utility Types 1 - Partial, Required, Readonly","Mapped Type-based Utility Types 2 - Pick, Omit, Record","Conditional Type-based Utility Types - Exclude, Extract, ReturnType"],["Getting Started with TypeScript React","State Management and Props 1","State Management and Props 2","Context API","Using external libraries","Introduction to TypeScript Templates"],["2026 One-Bite Series Continuous Lecture Discount Event"]],"topics":["Introduction","TypeScript Basics","Understanding TypeScript","Functions and Types","Interface","Class","Generics","Manipulating Types","Conditional Types","Utility Types","React and TypeScript","Closing"],"bank":[[["Which command checks TypeScript types without emitting JavaScript?","tsc --noEmit","node --check","npm run node","tsc --execute","A","tsc --noEmit performs type checking without generating output."],["TypeScript types normally exist at runtime.","False","True","Only in Node","Only in React","A","Type annotations are erased during compilation."],["Which compiler option enables strict type checking?","strict","debug","typed","runtime","A","strict enables a family of stricter checks."],["Fill the blank: let age: ___ = 25;","number","Number()","int","float","A","The primitive numeric type is number."],["Which file commonly stores TypeScript compiler options?","tsconfig.json","package-lock.json","index.ts","types.lock","A","tsconfig.json configures the TypeScript compiler."]],[["Which is a valid tuple type for name and age?","[string, number]","string | number","string[]","{string,number}","A","Tuples specify element positions and types."],["What type does const state = 'ready' infer?","'ready'","string[]","unknown","any","A","A const primitive binding retains its literal type."],["Which type forces narrowing before arbitrary property access?","unknown","any","never","void","A","unknown is safer than any because usage requires narrowing."],["What does a function returning never indicate?","It never completes normally","It returns undefined","It returns null","It is asynchronous","A","never denotes no reachable normal return."],["Fill the blank: type Scores = ___[]; for numeric scores","number","integer","numeric","float","A","number[] is an array of numbers."],["Which declaration allows any string key with numeric values?","{ [key: string]: number }","{ [key: number]: string }","[string, number]","Record<number, string>","A","An index signature maps string keys to number values."],["Which assignment is invalid?","let n: number = '3'","let n: number = 3","let s: string = '3'","let b: boolean = true","A","A string is not assignable to number."]],[["What does typeof x === 'string' do inside an if?","Narrows x to string","Converts x to string","Asserts x as any","Changes x at runtime","A","typeof is a runtime guard that TypeScript understands."],["Which property commonly distinguishes discriminated union members?","A shared literal-valued kind field","A random ID","A private method","A generic parameter","A","A common literal discriminant supports exhaustive branching."],["What does 'as string' do?","Makes a type assertion","Converts the value at runtime","Validates the value","Serializes the value","A","Assertions change the static view, not runtime data."],["Given type A = string | number, A represents:","A union of possible values","An intersection of values","Only strings","An array","A","Union types accept values belonging to either member."],["Which type accepts every value but permits no unsafe operations without narrowing?","unknown","never","void","null","A","unknown is the top safe type."],["Which is a valid narrowing guard for nullable user?","if (user !== null)","if (user as null)","if (type user)","if (user: null)","A","An explicit null check narrows the remaining branch."]],[["What is the return type of (x: number) => x * 2?","number","void","never","string","A","Multiplication produces a number."],["Which syntax declares an optional parameter?","name?: string","name!: string","name: string?","?name: string","A","A question mark after the parameter name marks it optional."],["What is a type predicate return type?","value is string","value as string","typeof value","string extends value","A","The is syntax declares a user-defined type guard."],["What must overload declarations be compatible with?","The implementation signature","The filename","The runtime constructor","The module name","A","Overload signatures must be supported by the implementation."],["What does void commonly represent for a function?","No useful return value","A thrown exception","A generic value","A boolean return","A","void models ignored or absent useful return values."]],[["Which keyword declares an interface?","interface","typeclass","contract","implements","A","interface declares an object shape."],["How does an interface inherit another interface?","extends","implements","inherits","using","A","Interfaces can extend one or more interfaces."],["Two interfaces with the same name in the same scope can:","Merge declarations","Always cause an error","Become classes","Become unions","A","Compatible interface declarations merge."],["Which syntax marks an interface property optional?","age?: number","age!: number","age: number?","optional age: number","A","The ? modifier marks an optional property."],["Which modifier prevents assignment to a property through its interface?","readonly","private","sealed","const","A","readonly prevents writes through that type."]],[["Which keyword creates a subclass?","extends","implements","inherits","instanceof","A","extends establishes class inheritance."],["Which modifier limits member access to its class?","private","public","readonly","static","A","private restricts TypeScript member access to the declaring class."],["Which modifier permits subclasses to access a member?","protected","private","readonly","export","A","protected allows access in the class and its subclasses."],["Which keyword checks that a class follows an interface?","implements","extends","satisfies class","conforms","A","implements checks a class instance against an interface."],["Where is a class instance initialized?","constructor","interface","namespace","enum","A","The constructor runs when a class instance is created."]],[["Which syntax declares a generic identity function?","function id<T>(x: T): T","function id(x: any): any<T>","function id(T x): T","function id<T = x>()","A","T captures the input type and preserves it in the return type."],["What does <T extends {id: number}> require?","T has numeric id","T is a subclass of Number","T must be a class","T must be an array","A","A generic constraint requires a compatible shape."],["What is the type of Promise<string> resolution?","string","Promise","number","void","A","The generic argument describes the fulfilled value."],["What is the return type of map on number[] with x => String(x)?","string[]","number[]","string","unknown[]","A","map creates an array of callback return values."],["What does Array<T> represent?","An array of T values","A tuple with T entries","A promise of T","A function returning T","A","Array<T> is generic array syntax."]],[["What is keyof {name: string; age: number}?","'name' | 'age'","string","number","'string' | 'number'","A","keyof produces a union of known property keys."],["What is User['name'] when name: string?","string","'name'","User","unknown","A","Indexed access retrieves the property type."],["Which mapped type makes each key optional?","{ [K in keyof T]?: T[K] }","{ [K of T]: T[K] }","{ [K in T]: never }","{ [K: keyof T]: T[K] }","A","A mapped type iterates over keys and adds ?."],["What does `${'a' | 'b'}Id` produce?","'aId' | 'bId'","string[]","'Id'","never","A","Template literal types distribute over union placeholders."],["What operator obtains the type of a declared value?","typeof","instanceof","keyof","in","A","typeof can query a value's static type in a type position."]],[["What is T extends string ? 1 : 0 when T = number?","0","1","number","never","A","number does not extend string."],["Conditional types distribute over unions when:","The checked type is a naked type parameter","Every type is a tuple","The condition uses keyof","The result is void","A","A naked generic parameter triggers distributivity."],["What does infer R do in a conditional type?","Introduces an inferred type variable","Creates a runtime variable","Runs a function","Imports a module","A","infer captures a type from a matched structure."],["Which utility can extract a function's return type?","ReturnType<F>","Parameters<F>","Awaited<F>","InstanceType<F>","A","ReturnType extracts a function signature's return type."],["How can distributivity be disabled?","Wrap both checked sides in tuples","Add readonly","Use keyof","Use any","A","Tuple wrapping prevents a naked checked type parameter."]],[["Which utility makes every property optional?","Partial<T>","Required<T>","Readonly<T>","Record<T,T>","A","Partial maps properties to optional."],["Which utility selects only specified keys?","Pick<T, K>","Omit<T, K>","Exclude<T, K>","Extract<T, K>","A","Pick constructs an object type with selected keys."],["Which utility removes specified keys?","Omit<T, K>","Pick<T, K>","Extract<T, K>","Record<T,K>","A","Omit excludes specified properties."],["Which utility constructs a key-value object type?","Record<K, V>","ReturnType<K>","Required<V>","Exclude<K,V>","A","Record maps keys K to values V."],["Which utility removes union members assignable to U?","Exclude<T,U>","Extract<T,U>","Pick<T,U>","Partial<T>","A","Exclude filters out matching union members."],["Which utility makes properties non-optional?","Required<T>","Partial<T>","Readonly<T>","Omit<T,K>","A","Required removes optional modifiers."]],[["How do you type a React state holding a number?","useState<number>(0)","useState(number, 0)","useState<0,number>()","useState: number(0)","A","useState accepts a generic state type."],["Which type is suitable for a required title prop?","{ title: string }","{ title?: never }","{ title: void }","{ title: unknown[] }","A","A required string property models the prop."],["What does React Context help avoid?","Repeated prop drilling","All component rendering","Every state update","TypeScript compilation","A","Context shares values across a component subtree."],["Which JSX event handler receives a click event?","onClick","onPress","click","onMouseTap","A","React exposes onClick for click events."],["Which type represents a React element returned by JSX?","React.JSX.Element","HTMLElement","string[]","Promise<void>","A","React.JSX.Element is the JSX element type."],["What is a typical type for an input change event?","React.ChangeEvent<HTMLInputElement>","React.MouseEvent<HTMLDivElement>","React.FormEvent<HTMLButtonElement>","React.KeyboardEvent<Document>","A","ChangeEvent<HTMLInputElement> describes an input change."]],[["What should you practice after finishing the course?","Build and type-check a small project","Remove every type annotation","Use any for every variable","Disable all compiler checks","A","A small strict-mode project reinforces the type system."]]]};
const {lectures,topics,bank}=DATA;
const lessons=lectures.flatMap((arr,section)=>arr.map((name,i)=>({id:lectures.slice(0,section).reduce((a,x)=>a+x.length,0)+i+1,name,section})));
const key='kodori-ts-lab-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{saved={}};saved={done:saved.done||{},results:saved.results||{},drafts:saved.drafts||{}};
let current=11,mode='lesson',questionIndex=0,choice=null,submitted=false;
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(saved))}
function qFor(l){let b=bank[l.section],offset=(l.id*3)%b.length;return Array.from({length:5},(_,i)=>{let x=b[(offset+i)%b.length];return {id:l.id+'-'+i,kind:i===3?'blank':i===4?'debug':'choice',prompt:x[0],options:x.slice(1,5),answer:0,explanation:x[6],lesson:l}})}
function codeTask(l){let subject=topics[l.section];return [{id:l.id+'-code1',kind:'code',prompt:'직접 작성: '+l.name+' 개념을 활용해 타입 안전한 TypeScript 예제 5~10줄을 작성하세요.',hint:'strict 모드에서 타입 오류 없이 작성하고 any 사용을 피하세요.',lesson:l},{id:l.id+'-code2',kind:'code',prompt:'리팩터링: '+subject+' 관련 타입을 재사용 가능한 type 또는 interface로 분리한 예제를 작성하세요.',hint:'중복 타입 선언을 줄이고 컴파일러로 확인하세요.',lesson:l}]}
function questions(){if(mode==='review'){return lessons.flatMap(qFor).filter(q=>saved.results[q.id]===false)}if(mode==='all')return lessons.flatMap(l=>[...qFor(l),...codeTask(l)]);let l=lessons[current-1];return [...qFor(l),...codeTask(l)]}
function updateStats(){let n=Object.keys(saved.done).filter(x=>saved.done[x]).length;$('done').textContent=n+'/64';$('progress').value=n;$('score').textContent=Object.values(saved.results).filter(Boolean).length;$('wrongCount').textContent=Object.values(saved.results).filter(x=>x===false).length}
function nav(){let term=$('search').value.toLowerCase();$('nav').innerHTML=topics.map((t,s)=>{let subset=lessons.filter(l=>l.section===s&&(!term||(l.name+' '+t).toLowerCase().includes(term)));if(!subset.length)return '';return '<div class="section"><button data-section="'+s+'">'+(s+1)+'. '+escapeHTML(t)+' ('+subset.length+')</button><div class="lessons">'+subset.map(l=>'<button class="'+(l.id===current&&mode==='lesson'?'active':'')+'" data-lesson="'+l.id+'">'+(saved.done[l.id]?'✓ ':'')+l.id+'. '+escapeHTML(l.name)+'</button>').join('')+'</div></div>'}).join('');document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{let el=b.nextElementSibling;el.classList.toggle('hidden')})}
function openLesson(id){current=id;mode='lesson';questionIndex=0;choice=null;submitted=false;render()}
function render(){nav();updateStats();let l=lessons[current-1];$('lesson').innerHTML='<div class="toprow"><span class="pill">Section '+(l.section+1)+' · Lecture '+l.id+'</span><span class="muted tiny">'+(saved.done[l.id]?'완료 ✓':'학습 중')+'</span></div><h1 style="margin-top:12px">'+escapeHTML(l.name)+'</h1><p>개념을 확인하고 실습으로 익히세요. 객관식 3문제, 빈칸 1문제, 디버깅 1문제, 직접 코딩 2문제가 제공됩니다. 직접 코딩 문제는 자동 실행·채점되지 않으며 스스로 컴파일해 확인해야 합니다.</p><div class="actions"><button class="primary" id="mark">'+(saved.done[l.id]?'완료 취소':'이 강의 완료 표시')+'</button><button class="secondary" id="nextLesson">다음 강의 →</button></div>';$('mark').onclick=()=>{saved.done[l.id]=!saved.done[l.id];save();render()};$('nextLesson').onclick=()=>openLesson(current===64?1:current+1);renderQuestion()}
function renderQuestion(){let qs=questions();if(!qs.length){$('practice').innerHTML='<h2>복습할 오답이 없어요 🎉</h2><button class="primary" id="back">강의로 돌아가기</button>';$('back').onclick=()=>openLesson(current);return}questionIndex=Math.min(questionIndex,qs.length-1);let q=qs[questionIndex],result=saved.results[q.id];let code=q.kind==='code';let optionOrder=[2,0,3,1];let options=code?'':optionOrder.map(i=>'<button class="option '+(choice===i?'selected ':'')+(submitted&&i===q.answer?'correct ':submitted&&choice===i&&i!==q.answer?'wrong':'')+'" data-option="'+i+'" '+(submitted?'disabled':'')+'><b>'+String.fromCharCode(65+optionOrder.indexOf(i))+'.</b> '+escapeHTML(q.options[i])+'</button>').join('');$('practice').innerHTML='<div class="toprow"><h2>'+(mode==='review'?'오답 복습':mode==='all'?'전체 연습':'강의별 실습')+'</h2><span class="pill">'+(questionIndex+1)+' / '+qs.length+'</span></div><p class="tiny">'+(q.kind==='choice'?'객관식':q.kind==='blank'?'빈칸 타입 선택':q.kind==='debug'?'오류·개념 판단':'직접 코딩')+' · Lecture '+q.lesson.id+'</p><h2>'+escapeHTML(q.prompt)+'</h2>'+(code?'<textarea id="editor" spellcheck="false" placeholder="// TypeScript 코드를 작성하세요...">'+escapeHTML(saved.drafts[q.id]||'')+'</textarea><p class="muted tiny">브라우저 내부에서 TypeScript를 실행하지 않습니다. VS Code 또는 TypeScript Playground에서 직접 타입 검사하세요.</p>':'<div class="options">'+options+'</div>')+(submitted?'<div class="feedback">'+(choice===q.answer?'✓ 정답! ':'다시 확인해 보세요. 정답: '+escapeHTML(q.options[q.answer])+'. ')+escapeHTML(q.explanation)+'</div>':'')+'<div class="actions">'+(code?'<button class="secondary" id="hint">힌트 보기</button><button class="primary" id="savedraft">코드 저장</button>':'<button class="primary" id="submit" '+(choice===null||submitted?'disabled':'')+'>정답 제출</button>')+'<button class="secondary" id="prev" '+(questionIndex===0?'disabled':'')+'>← 이전</button><button class="secondary" id="next">다음 →</button></div><p class="muted tiny" id="notice"></p>';document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{choice=+b.dataset.option;renderQuestion()});if(code){$('editor').oninput=e=>{saved.drafts[q.id]=e.target.value;save()};$('savedraft').onclick=()=>{$('notice').textContent='코드가 이 브라우저에 저장되었습니다.'};$('hint').onclick=()=>{$('notice').textContent=q.hint}}else{$('submit').onclick=()=>{if(choice===null)return;saved.results[q.id]=choice===q.answer;save();submitted=true;renderQuestion()}}$('prev').onclick=()=>{questionIndex--;choice=null;submitted=false;renderQuestion()};$('next').onclick=()=>{if(questionIndex<qs.length-1){questionIndex++;choice=null;submitted=false;renderQuestion()}else if(mode==='lesson'){openLesson(current===64?1:current+1)}else{questionIndex=0;choice=null;submitted=false;renderQuestion()}}}
$('search').oninput=nav;$('review').onclick=()=>{mode='review';questionIndex=0;choice=null;submitted=false;render()};$('all').onclick=()=>{mode='all';questionIndex=0;choice=null;submitted=false;render()};$('reset').onclick=()=>{if(confirm('모든 학습 기록과 코드 초안을 삭제할까요?')){saved={done:{},results:{},drafts:{}};save();render()}};render();
</script></body></html>
