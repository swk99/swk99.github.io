name: AI Paper Studio tests
on:
  push:
    paths: ['ai-paper-studio/**', '.github/workflows/ai-paper-studio-tests.yml']
  pull_request:
    paths: ['ai-paper-studio/**', '.github/workflows/ai-paper-studio-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check ai-paper-studio/app.mjs
      - run: node ai-paper-studio/tests.mjs
      - run: python -m unittest discover -s ai-paper-studio/tools -p 'test_*.py'
