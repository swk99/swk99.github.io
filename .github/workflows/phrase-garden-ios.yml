name: Phrase Garden Flutter iOS
on:
  push:
    branches: [master]
    paths: ['mobile/phrase_garden/**', '.github/workflows/phrase-garden-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phrase-garden-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/phrase_garden
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git flutter
          git -C flutter checkout abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      - name: Generate iOS host and resolve packages
        run: |
          flutter create --platforms=ios --org io.github.swk99 --project-name phrase_garden --no-pub .
          rm -f test/widget_test.dart
          flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and small-screen widget tests
        run: flutter test test --reporter expanded
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug
      - name: Boot iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: iOS integration test
        run: flutter test integration_test/app_test.dart -d "$IOS_DEVICE_ID" --reporter expanded
      - name: Package simulator build and reproducible project
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app artifacts/Phrase-Garden-iOS-Simulator.zip
          zip -r artifacts/Phrase-Garden-Flutter-Source.zip lib assets test integration_test ios pubspec.yaml pubspec.lock README.md .metadata -x 'ios/Pods/*' 'ios/.symlinks/*' 'ios/Flutter/ephemeral/*' 'ios/Flutter/Generated.xcconfig' 'ios/Flutter/flutter_export_environment.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: Phrase-Garden-iOS
          path: mobile/phrase_garden/artifacts/*.zip
          retention-days: 30
